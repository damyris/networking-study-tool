<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0905">
<title>Cert Bench</title>
<meta name="description" content="Quick, ADHD-friendly practice for CompTIA A+ Core 1, A+ Core 2, and Linux+. Short sprints, instant feedback, and explanations of why your pick was wrong.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230C0905'/%3E%3Ctext x='4' y='22' font-family='monospace' font-weight='700' font-size='16' fill='%23FFB547'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one terminal "window" column on a CRT. Phosphor color is a setting (amber / green / ice); scanlines + glow are a setting too. */
:root{
  --bg:#0C0905; --bg2:#15100A; --bg3:#1F170D; --fg:#FFB547; --dim:#C4893A; --faint:#6E5024; --line:#3B2B14; --hi:#FFE3AE;
  --ok:#8DF0A0; --bad:#FF6B5A; --glow:rgba(255,181,71,.45);
  --display:"VT323","Courier New",monospace;
  --body:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
body.ph-green{--bg:#06100A; --bg2:#0B1A10; --bg3:#112417; --fg:#4CFF86; --dim:#3BC46A; --faint:#1F6B3A; --line:#173A22; --hi:#D2FFE0; --ok:#F2FFF6; --bad:#FF6B5A; --glow:rgba(76,255,134,.4)}
body.ph-ice{--bg:#070B10; --bg2:#0E141C; --bg3:#151D28; --fg:#CFE8FF; --dim:#93AEC8; --faint:#46596D; --line:#223042; --hi:#FFFFFF; --ok:#7DF7A8; --bad:#FF7A6B; --glow:rgba(180,220,255,.35)}
/* Themes beyond the phosphors: --acc is the highlight color (defaults to --fg, so amber/green/ice look unchanged). */
body{--acc:var(--fg); --on-acc:var(--bg); --scan:.22; --wall:var(--bg)}
body.ph-rice{--bg:#1D1916; --bg2:#241F1B; --bg3:#2C2622; --fg:#E8DCC8; --dim:#A8998A; --faint:#7D7063; --line:#3A322C; --hi:#F5ECDD; --ok:#A9B665; --bad:#EA6962; --glow:rgba(217,130,91,.16); --acc:#D9825B; --on-acc:#1D1916; --scan:.07;
  --wall:radial-gradient(rgba(232,220,200,.06) 1px,transparent 1.6px) 0 0/22px 22px fixed,radial-gradient(60% 50% at 18% 8%,rgba(217,130,91,.24),transparent 70%) fixed,radial-gradient(50% 50% at 88% 92%,rgba(127,162,184,.18),transparent 70%) fixed,linear-gradient(160deg,#2A3138 0%,#3E3A38 35%,#3A2C23 65%,#1D1916 100%) fixed,#1D1916}
body.ph-shell{--bg:#0F0F0F; --bg2:#161616; --bg3:#1E1E1E; --fg:#D9D5CB; --dim:#8C887F; --faint:#64615A; --line:#2B2B2B; --hi:#F4F1EA; --ok:#4ADE80; --bad:#F87171; --glow:rgba(242,169,59,.12); --acc:#F2A93B; --on-acc:#111111; --scan:.12}
body.ph-dusk{--bg:#0E0B08; --bg2:#18130D; --bg3:#211A12; --fg:#EDE5D2; --dim:#A39A88; --faint:#776E60; --line:#2E271F; --hi:#F8F2E2; --ok:#2BB3AA; --bad:#F2705E; --glow:rgba(245,165,36,.14); --acc:#F5A524; --on-acc:#1A1206; --scan:.06;
  --wall:radial-gradient(70% 55% at 12% 8%,rgba(245,165,36,.24),transparent 70%) fixed,radial-gradient(55% 55% at 92% 96%,rgba(43,179,170,.2),transparent 70%) fixed,linear-gradient(rgba(237,229,210,.04) 1px,transparent 1px) 0 0/56px 56px fixed,linear-gradient(90deg,rgba(237,229,210,.04) 1px,transparent 1px) 0 0/56px 56px fixed,#0E0B08}
body.ph-paper{color-scheme:light; --bg:#F3ECDC; --bg2:#FBF6EA; --bg3:#EFE5D0; --fg:#3A2E22; --dim:#6E5E48; --faint:#8A7860; --line:#D9CCB2; --hi:#16100A; --ok:#2E7D32; --bad:#C0392B; --glow:transparent; --acc:#B5540F; --on-acc:#FFF8EC; --scan:.05}
body:is(.ph-rice,.ph-shell,.ph-dusk){
  --display:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --body:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100vh}
body.crt{text-shadow:0 0 5px var(--glow)}
body.crt::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,var(--scan)) 0,rgba(0,0,0,var(--scan)) 1px,transparent 1px,transparent 3px)}
body.crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:31;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
body.crt.boot #wrap{animation:poweron .5s ease-out}
@keyframes poweron{0%{opacity:0;transform:scaleY(.02);filter:brightness(3)}60%{opacity:1;transform:scaleY(1.02)}100%{transform:none;filter:none}}

.wrap{max-width:820px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1120px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1;letter-spacing:.02em;text-wrap:balance;margin:0;text-transform:uppercase}
button,input,select,textarea{font:inherit;color:inherit;text-shadow:inherit}
button{cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px dashed var(--hi);outline-offset:3px}
.silk{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.mono{font-family:var(--mono)}
.tabnum{font-variant-numeric:tabular-nums}
a{color:var(--hi)}

/* top bar: the window title line */
.bar{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;border:2px solid var(--fg);border-bottom:0;padding:6px 12px;background:var(--bg2)}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;letter-spacing:.04em}
.brand span{font-size:12px;color:var(--dim)}
.bar .spacer{flex:1}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.stat strong{color:var(--fg);font-weight:600}
.led{width:9px;height:9px;background:var(--fg);box-shadow:0 0 8px var(--glow)}
.led.off{background:var(--faint);box-shadow:none}
.snd{background:none;border:1px solid var(--line);padding:2px 8px;font-size:12px;color:var(--dim);letter-spacing:.08em}
.snd:hover{border-color:var(--fg);color:var(--fg)}
main#view{border:2px solid var(--fg);background:var(--bg);padding:20px;min-height:320px}

/* shared */
.panel{border:1px solid var(--line);padding:18px;background:var(--bg2)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--fg);background:transparent;padding:9px 16px;min-height:44px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.btn:hover:not([disabled]){background:var(--fg);color:var(--bg);text-shadow:none}
.btn.primary{background:var(--fg);color:var(--bg);text-shadow:none}
.btn.primary:hover:not([disabled]){background:var(--hi);border-color:var(--hi)}
.btn.ghost{border-color:transparent;color:var(--dim)}
.btn.ghost:hover:not([disabled]){border-color:var(--fg);background:transparent;color:var(--fg)}
.btn.small{min-height:34px;padding:5px 12px;font-size:12px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:var(--bg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;padding:0 5px;opacity:.75;font-weight:400;letter-spacing:0}
.cursor{display:inline-block;width:.6em;height:1.05em;background:currentColor;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ok-t{color:var(--ok)}
.bad-t{color:var(--bad)}

/* home */
.boot{margin:0;font-family:var(--mono);font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.boot .k{color:var(--dim)}
.boot.anim .ln{display:block;animation:typein .25s steps(6) both}
.boot .ln{display:block}
@keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.go{font-size:clamp(20px,4.6vw,26px);min-height:64px;padding:14px 22px;font-family:var(--display);letter-spacing:.06em;font-weight:400;align-self:flex-start}
.go kbd{font-family:var(--mono);font-size:12px}
.sub{margin:0;color:var(--dim);max-width:62ch}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg2);padding:14px 16px;min-height:72px}
.cmd:hover{border-color:var(--fg);background:var(--bg3)}
.cmd kbd{grid-row:1/3;font-size:16px;padding:4px 9px;opacity:1}
.cmd b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;text-transform:uppercase}
.cmd span{font-size:13px;color:var(--dim)}
details.drawer{border-top:1px dashed var(--line);padding-top:12px}
details.drawer>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;min-height:32px}
details.drawer>summary::-webkit-details-marker{display:none}
details.drawer>summary::before{content:"[+]";color:var(--fg)}
details.drawer[open]>summary::before{content:"[-]"}
details.drawer>summary:hover{color:var(--fg)}
.drawer-body{padding-top:12px;display:flex;flex-direction:column;gap:14px}
/* sprint setup */
.setup{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.mixrows{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.mixrows label{font-size:14px;min-width:0;overflow-wrap:anywhere}
.mixrows select{width:auto}
.setup-line{margin:-6px 0 0}
.setup .count{margin:0}
.courses{display:flex;gap:6px;flex-wrap:wrap}
.course{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--bg2);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.course b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;text-transform:uppercase;white-space:nowrap}
.course span{font-size:12px;color:var(--dim)}
.course:hover{border-color:var(--fg)}
.course[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.course[aria-pressed="true"] span{color:var(--bg)}
.domains{display:flex;flex-direction:column;gap:2px}
.dom{display:grid;grid-template-columns:40px minmax(0,1fr) 150px 48px;gap:12px;align-items:center;padding:8px;background:none;border:1px solid transparent;text-align:left;width:100%}
.dom:hover{border-color:var(--fg);background:var(--bg3)}
.dom .ref{font-family:var(--display);font-size:24px;color:var(--dim)}
.dom .nm{font-weight:600;min-width:0;font-size:15px}
.dom .nm small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.meter{height:12px;border:1px solid var(--dim);padding:1px;display:block}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--fg) 0 6px,transparent 6px 8px)}
.dom .pct{font-size:14px;text-align:right}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sectionhead h2{font-size:30px}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--dim);font-size:12px}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pick-h{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;line-height:1;text-transform:uppercase;animation:wobble 2.6s ease-in-out infinite}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px solid var(--line);background:var(--bg2);padding:18px;min-height:190px;animation:bouncein .6s cubic-bezier(.3,1.6,.5,1) both;transition:transform .18s cubic-bezier(.3,1.8,.5,1),border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-6px) rotate(-1.2deg) scale(1.03);border-color:var(--fg)}
.card:hover .mascot,.card:hover .ico{animation:hop .5s ease-in-out infinite alternate}
.card b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;text-transform:uppercase}
.card .code{color:var(--dim);font-size:13px}.card .meta{color:var(--faint);font-size:12px;margin-top:auto}
.card .enter{font-size:12px;letter-spacing:.1em}
.ico{font-family:var(--display);font-size:40px;line-height:1;display:inline-block}
.mascot{display:inline-block;color:var(--fg);animation:waddle 1.8s ease-in-out infinite;transform-origin:50% 100%}
.mascot img{display:block;filter:drop-shadow(0 0 1.5px var(--dim))}.crumb .mascot img{width:32px;height:38px}
.byline{margin:4px 0 0;color:var(--dim);font-size:14px;text-align:center}.byline b{color:var(--fg);animation:glowpulse 2s ease-in-out infinite alternate}
@keyframes bouncein{0%{opacity:0;transform:translateY(30px) scale(.85)}100%{opacity:1;transform:none}}
@keyframes hop{to{transform:translateY(-8px)}}
@keyframes waddle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}50%{transform:rotate(-1deg) scale(1.01)}}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}50%{transform:scale(.94,1.06)}70%{transform:scale(1.03,.98)}100%{transform:scale(1)}}
.btn:active,.opt:active,.cmd:active,.dom:active,.card:active{animation:jelly .35s ease}
.cmd,.dom,.opt{transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.cmd:hover{transform:translateY(-3px) rotate(-.6deg)}
.opt:hover:not([disabled]){transform:translateX(4px)}
.go:hover{animation:jelly .5s ease}
main#view>.stack{animation:bouncein .45s cubic-bezier(.3,1.5,.5,1) both}
main#view>.stack.still{animation:none}
.legal{margin:14px 0 0;color:var(--faint);font-size:11px;text-align:center;letter-spacing:.04em}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.qnum{font-size:13px;color:var(--dim);letter-spacing:.08em}
.pips{display:flex;gap:3px;flex:1;min-width:150px}
.pips i{flex:1;height:12px;border:1px solid var(--dim)}
.pips i.ok{background:var(--ok);border-color:var(--ok)}
.pips i.bad{background:var(--bad);border-color:var(--bad)}
.pips i.now{background:var(--fg);animation:blink 1s steps(1) infinite}
.combo{font-family:var(--display);font-size:24px;line-height:1;color:var(--fg);border:1px solid var(--fg);padding:2px 10px;min-width:64px;text-align:center}
.combo.zero{color:var(--faint);border-color:var(--line)}
.combo.pop{animation:pop .4s ease}
.combo.hot{background:var(--fg);color:var(--bg);text-shadow:none}
@keyframes pop{40%{transform:scale(1.35)}}
.card{position:relative}
.card.shake{animation:shake .3s ease}
.card.glow{animation:glowpulse .7s ease}
@keyframes shake{20%{transform:translateX(-7px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
@keyframes glowpulse{0%{filter:brightness(1.6)}100%{filter:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{font-size:12px;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--line);padding:1px 8px;color:var(--dim)}
.chip.hot{color:var(--bg);background:var(--fg);border-color:var(--fg);text-shadow:none}
.ticket{border:1px dashed var(--dim);padding:10px 14px;margin-bottom:16px;background:var(--bg2)}
.ticket .silk{display:block;margin-bottom:4px}
.ticket .silk::before{content:"INCOMING TICKET // "}
.ticket q{quotes:"\201C" "\201D";color:var(--hi)}
.qtext{font-size:21px;font-weight:600;line-height:1.4;margin:0 0 18px;max-width:62ch;color:var(--hi)}
.qtext::before{content:"> ";color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:transparent;border:1px solid var(--line);padding:11px 14px;min-height:54px;font-size:16px;width:100%}
.opt:hover:not([disabled]){background:var(--fg);color:var(--bg);border-color:var(--fg);text-shadow:none}
.opt:hover:not([disabled]) .k{border-color:var(--bg);color:var(--bg)}
.opt .k{font-weight:600;font-size:14px;width:30px;height:28px;border:1px solid var(--dim);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.opt.sel{border-color:var(--fg);background:var(--bg3)}
.opt.sel .k{background:var(--fg);color:var(--bg);border-color:var(--fg);text-shadow:none}
.opt.right{border-color:var(--ok);color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--bg);text-shadow:none}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--bg);text-shadow:none}
.opt[disabled]{cursor:default}
.opt .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.opt.right .tag::after{content:" [OK]"}
.opt.wrong .tag::after{content:" [X]"}
.qactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.guess{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--dim);padding:6px 14px;background:transparent;color:var(--dim);font-size:13px;min-height:36px;text-transform:uppercase;letter-spacing:.06em}
.guess[aria-pressed="true"]{border-style:solid;border-color:var(--fg);color:var(--bg);background:var(--fg);text-shadow:none}
.typein{display:flex;gap:10px;flex-wrap:wrap}
.typein input{flex:1;min-width:0;font-size:22px;padding:10px 14px;border:2px solid var(--fg);background:var(--bg);caret-color:var(--fg)}
.typein input::placeholder{color:var(--faint)}

.fb{margin-top:18px;border:2px solid var(--line)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb .head{display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.fb.ok .head{background:var(--ok);color:var(--bg);text-shadow:none}
.fb.bad .head{background:var(--bad);color:var(--bg);text-shadow:none}
.fb .head h3{font-size:34px}
.fb.ok .head h3::before{content:">> "}
.fb.bad .head h3::before{content:"!! "}
.fb .head .xp{font-size:15px;font-weight:600;margin-left:auto;animation:floatup .7s ease both}
@keyframes floatup{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.fb .body{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.fb .blk .silk{display:block;margin-bottom:3px}
.fb .blk .silk::before{content:"// "}
.fb .blk p{margin:0;max-width:66ch}
.fb .blk ul,.fb .blk ol{font-size:15px}
.hook{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--fg);padding:10px 12px;background:var(--bg3)}
.hook .silk{color:var(--fg);flex:none;padding-top:3px}
.hook .silk::before{content:"★ "}
.hook p{margin:0;font-weight:600;color:var(--hi)}
details.others{border-top:1px dashed var(--line);padding-top:10px}
details.others summary{cursor:pointer;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
details.others ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ai{border:1px solid var(--line);padding:12px;background:var(--bg2);display:flex;flex-direction:column;gap:10px}
.ai .out p{margin:0 0 8px}
.ai .out ul{margin:0 0 8px;padding-left:18px}
.ai .ask{display:flex;gap:8px}
.ai .ask input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--dim);background:var(--bg)}

/* lightning */
.timer{height:14px;border:1px solid var(--dim);padding:1px;flex:1;min-width:150px}

.timer.warn i{background:var(--acc);animation:tpulse .8s ease-in-out infinite alternate}
.timer.over{border-color:var(--bad)}.timer.over i{background:var(--bad)}
.timer.over+#timeLeft{color:var(--bad)}
@keyframes tpulse{to{opacity:.45}}
@media (prefers-reduced-motion: reduce){.timer.warn i{animation:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bigscore{font-family:var(--display);font-size:40px;line-height:1}
.flash{margin-top:14px;padding:10px 14px;font-weight:600;border:2px solid}

/* summary */
.done-head{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center}
.grade{font-family:var(--display);font-size:clamp(110px,22vw,160px);line-height:.8;grid-row:1/4;color:var(--hi);text-shadow:0 0 18px var(--glow)}

.score .n{font-family:var(--display);font-size:clamp(56px,11vw,80px);line-height:.9}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:1px solid var(--line);padding:10px 12px;background:var(--bg2)}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1}
.tile span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.miss{border-top:1px dashed var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.miss:first-of-type{border-top:0}
.miss .a{color:var(--ok);font-weight:600}
.miss .a::before{content:"→ "}
.miss .h{color:var(--fg);font-size:13px}

/* overlays */
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:40;text-align:center;pointer-events:none;
  background:var(--bg);border:3px double var(--fg);padding:16px 30px;box-shadow:0 0 40px var(--glow);max-width:calc(100% - 32px)}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(42px,10vw,72px);line-height:1;color:var(--hi);text-shadow:0 0 14px var(--glow)}
.banner span{display:block;font-size:14px;color:var(--fg);text-transform:uppercase;letter-spacing:.12em;margin-top:6px}
.banner.show{animation:bannerin 1.2s ease both}
@keyframes bannerin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:39}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto;margin-top:10px}
.li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;text-align:left;border:1px solid transparent;background:none;padding:8px;font-size:13px;width:100%}

.li.on{background:var(--fg);color:var(--bg);text-shadow:none}

.field textarea{min-height:64px;resize:vertical}
select option{background:var(--bg);color:var(--fg)}

<script>
(function(){
"use strict";

/* ───────── constants ───────── */
/* Courses. Core 1 lives in bank.js (window.BANK / window.FACTS); the others register themselves in window.COURSES. */
const COURSES=Object.assign({},window.COURSES||{});
COURSES.core1={id:"core1",name:"A+ Core 1",brand:"CORE1_BENCH",code:"220-1201",exam:"CompTIA A+ Core 1 (220-1201)",bios:"v1.201",
  lightning:"Ports, RAID, Wi-Fi, printers",bank:window.BANK||[],domains:{
  1:{name:"Mobile Devices",short:"Mobile",w:13},
  2:{name:"Networking",short:"Networking",w:23},
  3:{name:"Hardware",short:"Hardware",w:25},
  4:{name:"Virtualization & Cloud",short:"Virt & Cloud",w:11},
  5:{name:"Hardware & Network Troubleshooting",short:"Troubleshooting",w:28}
},topics:{
  printers:{name:"Printers & MFDs",short:"Printers",ref:"PR",note:"Spread across D3 + D5",match:q=>/print/i.test(q.t||"")}
}};
const COURSE_ORDER=["core1","core2","linux"].filter(k=>COURSES[k]);
let COURSE,DOMAINS,DOMAIN_IDS,TOPICS,BANK;

/* Topic tracks cut across domains. Questions keep their real domain so exam weighting stays honest. */
function useCourse(id){
  COURSE=COURSES[id]||COURSES.core1;

  TOPICS={};for(const [k,t] of Object.entries(COURSE.topics||{}))TOPICS[k]=Object.assign({},t,{match:t.match||(q=>new RegExp(t.re,"i").test(q.t||""))});

  document.title=COURSE.name+" · Cert Bench";
  const bn=document.getElementById("brandName");if(bn){bn.textContent=COURSE.brand;document.getElementById("brandCode").textContent=COURSE.code}
}
const courseOf=id=>id.startsWith("g:dr:")?id.split(":")[2]:id.startsWith("g:")?"core1":null;

/* ───────── helpers ───────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sampleN=(a,n)=>shuffle(a).slice(0,n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const clone=o=>JSON.parse(JSON.stringify(o));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let toastT;

/* ───────── effects: sound, banners, pixel confetti ───────── */
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const SFX={
  ctx:null,
  play(name){
    if(!S.settings.sound)return;

function weightFor(id,now){
  const st=S.stats[id]; if(!st||st.b==null)return 4;
  if(st.b===0)return 7;
  return now-st.l>INTERVAL[st.b]?3:0.35;
}
function weighted(items,n){
  const pool=items.slice(),out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0].q);
  }
  return out;
}
function buildSprint(n,domain,topic){
  const now=Date.now(),recent=new Set(S.recent);
  const st=S.settings,mixed=!domain&&!topic,factor=d=>mixed?SprintSetup.domainFactor(d,COURSE,st):1;
  const pool=SprintSetup.filterByTypes(allQuestions(),st.qTypes).filter(q=>(!domain||q.d===domain)&&(!topic||TOPICS[topic].match(q))&&factor(q.d)>0);
  const keep=k=>SprintSetup.keepGen(k,COURSE,st,mixed);
  const genCount=genKinds(domain,topic,st.qTypes,keep).length?Math.max(1,Math.round(n*0.2)):0;
  const scored=pool.map(q=>({q,w:weightFor(q.id,now)*factor(q.d)*(recent.has(q.id)?0.12:1)}));
  const picks=weighted(scored,n-genCount);
  for(let i=0;i<genCount;i++){
    let g=null;for(let t=0;t<8&&(!g||recent.has(g.id)||picks.some(p=>p.id===g.id||(p.gen&&p.t===g.t))||factor(g.d)===0);t++)g=randomGen(domain,topic,st.qTypes,keep);
    if(g&&factor(g.d)===0)g=null;
    if(g)picks.splice(Math.floor(Math.random()*(picks.length+1)),0,g);
  }
  /* a drill slot that found nothing goes back to the bank, so the sprint keeps its length */
  if(picks.length<n)picks.push(...weighted(scored.filter(s=>!picks.includes(s.q)),n-picks.length));
  return picks;
}

  const n=S.settings.roundLen;
  let qs=[];
  if(mode==="sprint")qs=buildSprint(n,opts.domain||0,opts.topic||"");
  else if(mode==="weak"){qs=weakIds().map(resolve).filter(Boolean);if(!qs.length){toast("No weak spots right now. Run a sprint to find some.");return}qs=SprintSetup.filterByTypes(qs,S.settings.qTypes).slice(0,n)}
  else if(mode==="list")qs=opts.list.map(x=>typeof x==="string"?resolve(x):x).filter(Boolean);
  else if(mode==="lightning")qs=[randomGen()];
  if(!qs.length){toast(mode==="sprint"||mode==="weak"?"Nothing matches. Loosen the setup.":"No questions match that yet.");return}
  if(mode==="sprint"&&qs.length<n&&SprintSetup.narrowed(COURSE,S.settings,!opts.domain&&!opts.topic))toast(SprintSetup.onlyMatchText(qs.length));
  else if(mode==="sprint"&&!opts.domain&&!opts.topic&&S.settings.mixPreset==="custom"&&SprintSetup.allDomainsOff(COURSE,S.settings))toast("All domains are off, so this sprint uses exam weighting");
  R={mode,domain:opts.domain||0,topic:opts.topic||"",queue:qs.map(q=>({q,comeback:false})),i:0,results:[],combo:0,maxCombo:0,xp:0,
     timer:mode==="lightning"?SprintSetup.createTimer({mode:"lightning",style:"strict",limitMs:60000})
       :S.settings.timeMode==="perQ"||S.settings.timeMode==="perSprint"?SprintSetup.createTimer({mode:S.settings.timeMode,style:S.settings.timeStyle==="strict"?"strict":"gentle",limitMs:S.settings.timeMode==="perQ"?S.settings.perQSec*1000:S.settings.perSprintMin*60000}):null,
     unreached:0,flash:null,cur:null,label:opts.label||""};
  view="quiz";loadCur();render();
  lastTick=0;$("#timerLive").textContent="";if(R.timer)tickTimer();
}
function loadCur(){
  const item=R.queue[R.i];const q=item.q;
  const n=(q.o||[]).length;let order=shuffle([...Array(n).keys()]);
  if(q.type==="order"&&n>1){let t=0;while(order.every((v,i)=>v===i)&&t++<10)order=shuffle(order)}
  if(R.timer)R.timer=R.timer.mode==="perQ"?SprintSetup.resetForQuestion(R.timer):SprintSetup.resumeTimer(R.timer);
  R.cur={q,comeback:item.comeback,order,picked:[],answered:false,ok:null,guess:false,input:"",ai:null,shown:Date.now(),t0:R.timer?R.timer.usedMs:0,timedOut:false};
}
const norm=s=>String(s).toLowerCase().replace(/\bport\b|\btcp\b|\budp\b/g,"").replace(/[\s,;–—-]+/g,"/").replace(/\/+/g,"/").replace(/^\/|\/$/g,"");

function grade(){
  const c=R.cur,q=c.q;if(c.answered)return;
  let ms=0,overMs=0;
  if(R.timer){R.timer=SprintSetup.stopTimer(R.timer);ms=R.timer.usedMs-c.t0;if(R.timer.mode==="perQ"&&R.timer.style==="gentle")overMs=Math.max(0,-SprintSetup.timerLeft(R.timer))}
  let ok=false;
  if(q.type==="mc")ok=c.picked[0]===q.a;
  else if(q.type==="multi"){const want=[...q.a].sort().join(),got=[...c.picked].sort().join();ok=want===got}
  else if(q.type==="order")ok=c.picked.length===q.o.length&&c.picked.every((v,i)=>v===i);
  else if(q.type==="input"){const v=norm(c.input);ok=!!v&&(q.ans||[]).some(a=>norm(a)===v)}
  c.answered=true;c.ok=ok;
  // stats
  const st=S.stats[q.id]||(S.stats[q.id]={s:0,c:0,w:0,b:null,l:0});
  st.s++;st.l=Date.now();
  if(ok){st.c++;st.b=c.comeback?1:c.guess?1:(st.b==null?2:Math.min(5,st.b+1))}else{st.w++;st.b=0}
  S.days[today()]=(S.days[today()]||0)+1;
  S.recent=[q.id,...S.recent.filter(x=>x!==q.id)].slice(0,30);
  // combo + xp
  let gain=0;const lvBefore=level(),goalBefore=(S.days[today()]||0)-1<S.settings.goal;
  if(ok){R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);gain=c.guess?5:c.comeback?8:10+Math.min(R.combo-1,10)*2}
  else R.combo=0;
  if(R.mode==="lightning")gain=ok?5+Math.min(R.combo,10):0;
  c.gain=gain;R.xp+=gain;S.xp+=gain;S.bestCombo=Math.max(S.bestCombo,R.maxCombo);
  R.results.push({id:q.id,q,ok,guess:c.guess,comeback:c.comeback,picked:c.picked.slice(),input:c.input,ms,overMs,timedOut:!!c.timedOut});
  // missed? bring it back three questions later
  if(!ok&&R.mode!=="lightning"&&!c.comeback&&!R.queue.slice(R.i+1).some(x=>x.q.id===q.id)){
    R.queue.splice(Math.min(R.i+4,R.queue.length),0,{q,comeback:true});
  }
  save("state");updateBar();
  SFX.play(ok?"ok":"bad");
  if(ok&&R.mode!=="lightning"&&[3,5,10,15,20,30].includes(R.combo))banner("COMBO x"+R.combo,R.combo>=10?"unstoppable":R.combo>=5?"on fire":"nice streak","combo");
  if(level()>lvBefore){banner("LEVEL "+level(),"level up","level");confetti(120)}
  if(goalBefore&&(S.days[today()]||0)>=S.settings.goal){banner("GOAL MET",S.settings.goal+" questions today","goal");confetti(80)}
  if(R.mode==="lightning"){
    R.flash={ok,q,c};render();
    setTimeout(()=>{if(!R||R.mode!=="lightning"||view!=="quiz")return;R.flash=null;R.queue.push({q:nextLightningQ(),comeback:false});R.i++;loadCur();render()},ok?450:1700);
    return;
  }
  render();
  {const card=$(".card");if(card){card.classList.remove("shake","glow");void card.offsetWidth;card.classList.add(ok?"glow":"shake")}}
  if(ok&&S.settings.autoNext)setTimeout(()=>{if(R&&R.cur===c&&view==="quiz")next()},1400);
}
function nextLightningQ(){
  const recent=R.results.slice(-6).map(r=>r.id);let g=null;
  for(let t=0;t<8&&(!g||recent.includes(g.id));t++)g=randomGen();
  return g;
}
function next(){
  if(!R)return;
  if(R.cur&&R.cur.ai&&R.cur.ai.ac)R.cur.ai.ac.abort();
  if(R.i+1>=R.queue.length){finish();return}
  R.i++;loadCur();render();
}
function finish(){
  if(!R)return;
  if(R.mode==="lightning"){const sc=R.results.filter(r=>r.ok).length;if(sc>bestL()){setBestL(sc);R.newBest=true}save("state")}
  view="summary";render();
  const firsts=R.results.filter(r=>!r.comeback),pct=firsts.length?firsts.filter(r=>r.ok).length/firsts.length:0;
  SFX.play("done");
  if(R.newBest){banner("NEW HIGH SCORE",bestL()+" in 60 seconds");confetti(140)}
  else if(R.mode!=="lightning"&&pct>=.7)confetti(pct===1?160:90);
}
let lightT,lastTick=0;
/* one clock for Lightning and timed sprints; state lives in R.timer, logic in sprint.js */
const timerView=SprintSetup.timerView;
function timerHTML(){
  const v=timerView(R.timer);
  return `<div class="timer ${v.cls}"><i id="timerBar" style="width:${v.pct}%"></i></div><span class="mono tabnum" id="timeLeft">${v.text}</span>`;
}
function timeOut(){
  const c=R.cur;if(!c||c.answered)return;
  c.timedOut=true;c.picked=[];c.input="";grade();
}
function tickTimer(){
  clearTimeout(lightT);
  if(!R||view!=="quiz"||!R.timer)return;
  const now=Date.now(),elapsed=lastTick?now-lastTick:0;lastTick=now;
  const {t,events}=SprintSetup.timerStep(R.timer,elapsed,!document.hidden);R.timer=t;
  const v=timerView(t),bar=$("#timerBar"),tl=$("#timeLeft"),live=$("#timerLive");
  if(bar){bar.style.width=v.pct+"%";bar.parentNode.className="timer "+v.cls}
  if(tl)tl.textContent=v.text;
  for(const e of events){
    if(t.mode==="lightning"){if(e==="timeout"){finish();return}continue}
    if(e==="warn10"&&S.settings.sound)SFX.play("tick");
    if(e==="warn30"||e==="warn10"||e==="over")live.textContent=e==="warn30"?"30 seconds left":e==="warn10"?"10 seconds left":"Time's up, keep going";
    if(e==="timeout"){
      /* announce after the render that grade()/finish() does, so the reader hears it */
      if(t.mode==="perSprint"){R.unreached=SprintSetup.unreachedCount(R.queue,R.i);finish();live.textContent="Time's up";return}
      timeOut();live.textContent="Time's up";
    }
  }
  if(R&&view==="quiz"&&R.timer)lightT=setTimeout(tickTimer,100);
}

/* ───────── Claude: explain another way + follow-ups ───────── */
const tutor=()=>`You're tutoring someone for the ${COURSE.exam} exam. They already have a solid IT foundation and they have ADHD, so keep it tight and concrete.
Rules: under 120 words. Plain language. Use one real-world analogy or on-the-job scenario. Focus on the misconception behind their pick, not just restating the answer. No headings, no preamble. Short paragraphs, or up to 3 bullets starting with "- ". You may bold one key phrase with **like this**.`;
function qContext(c){
  const q=c.q;let s=`Question: ${q.ticket?"Ticket: \""+q.ticket+"\" ":""}${q.q}\n`;
  if(q.type==="mc"||q.type==="multi"){
    s+="Options:\n"+q.o.map((o,i)=>`- ${o}${(Array.isArray(q.a)?q.a.includes(i):q.a===i)?" (correct)":""}`).join("\n")+"\n";
    s+="They picked: "+(c.picked.length?c.picked.map(i=>q.o[i]).join("; "):"nothing")+"\n";
  }else if(q.type==="order"){s+="Correct order: "+q.o.join(" → ")+"\nTheir order: "+c.picked.map(i=>q.o[i]).join(" → ")+"\n"}
  else s+=`Correct answer: ${(q.ans||[])[0]}\nThey typed: ${c.input||"(blank)"}\n`;
  s+=`They were ${c.ok?"right":"wrong"}.${c.guess?" They said they were guessing.":""}\nReference explanation: ${q.x||""}`;
  return s;
}
function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").split(/\n/);let h="",inList=false;
  for(const l of lines){
    if(/^\s*[-•]\s+/.test(l)){if(!inList){h+="<ul>";inList=true}h+="<li>"+l.replace(/^\s*[-•]\s+/,"")+"</li>"}
    else{if(inList){h+="</ul>";inList=false}if(l.trim())h+="<p>"+l+"</p>"}
  }
  return h+(inList?"</ul>":"");
}
async function askClaude(follow){
  const c=R&&R.cur;if(!c||!AI)return;
  c.ai=c.ai||{msgs:[],text:"",busy:false,err:""};
  if(c.ai.busy)return;
  if(follow){
    const v=follow.trim();if(!v)return;
    c.ai.msgs.push({role:"assistant",content:c.ai.text||"(no answer)"},{role:"user",content:v});
    c.ai.asked=v;
  }else{
    c.ai.msgs=[{role:"user",content:tutor()+"\n\n"+qContext(c)+"\n\nExplain this a different way than the reference explanation, so it actually clicks."}];
    c.ai.asked="";
  }
  c.ai.busy=true;c.ai.text="";c.ai.err="";renderAI();
  const ac=new AbortController();c.ai.ac=ac;
  try{
    const r=await AI(c.ai.msgs,{signal:ac.signal,cache:false,onText:({text})=>{c.ai.text=text;renderAI()}});
    c.ai.text=r.text;
  }catch(e){
    c.ai.text=e&&e.text||"";
    if(e&&e.code==="cancelled"){}
    else if(e&&e.code==="not_granted"){AI=null;c.ai.err="Claude wasn't allowed on this page, so this button is now hidden."}
    else if(e&&e.code==="rate_limited")c.ai.err="Claude is busy right now. Try again in a minute.";
    else c.ai.err="Claude couldn't answer that one. Try again later.";
    if(c.ai.msgs.length>1&&follow)c.ai.msgs.splice(-2,2);
  }
  c.ai.busy=false;if(R&&R.cur===c)renderAI();
}
function aiHTML(c){
  if(!AI&&!(c.ai&&c.ai.err))return "";
  const a=c.ai;
  if(!a)return `<div id="aiBox"><button class="btn small" data-act="ai-explain">Explain it another way <kbd>E</kbd></button></div>`;
  return `<div id="aiBox" class="ai">
    <span class="silk">Claude, explaining it differently</span>
    ${a.asked?`<div class="silk" style="text-transform:none;letter-spacing:0">You asked: ${esc(a.asked)}</div>`:""}
    <div class="out">${a.text?md(a.text):a.busy?`<p class="thinking">Thinking…</p>`:""}</div>
    ${a.err?`<p style="margin:0;color:var(--bad)">${esc(a.err)}</p>`:""}
    ${AI?`<form class="ask" data-form="ai-follow"><input id="aiFollow" type="text" placeholder="Still fuzzy? Ask a follow-up…" ${a.busy?"disabled":""} autocomplete="off"><button class="btn small" ${a.busy?"disabled":""}>Ask</button>${a.busy?`<button type="button" class="btn small ghost" data-act="ai-stop">Stop</button>`:""}</form>`:""}
  </div>`;
}
function renderAI(){const box=$("#aiBox");if(box&&R&&R.cur)box.outerHTML=aiHTML(R.cur)}

let genBusy=false;
async function generateQuestions(d,topic){
  if(!AI||genBusy)return;
  genBusy=true;render();toast("Claude is writing 5 questions. This can take up to a minute.");
  const example=JSON.stringify({t:"DNS",ticket:"I can ping 8.8.8.8 but websites won't load.",q:"What's the likely problem?",o:["DNS name resolution","The default gateway","DHCP","The subnet mask"],a:0,w:{"1":"If the gateway were wrong you couldn't reach 8.8.8.8 at all.","2":"They have a working IP.","3":"A wrong mask would also break routing."},x:"Reaching an IP but not a name is the classic DNS symptom.",h:"Numbers work, names don't → DNS."});
  const have=allQuestions().filter(q=>q.d===d).map(q=>"- "+q.q).slice(0,60).join("\n");
  const prompt=`Write 5 new multiple-choice practice questions for ${COURSE.exam}, domain ${d}.0 ${DOMAINS[d].name}${topic?", focused on: "+topic:""}.
The learner has a solid foundation and ADHD: make them scenario-based and specific (like MeasureUp-quality items), with tempting distractors built on real misconceptions. Mix in help-desk tickets for about half.
Every fact must be accurate for the ${COURSE.code} objectives. Exactly 4 options, one correct. Put the correct answer at any index.
"w" maps EVERY wrong option's index (as a string) to one or two sentences on why that pick is wrong. "x" is a 1–2 sentence explanation of why the answer is right. "h" is a short memory hook. "ticket" is optional (omit or use an empty string).
Avoid repeating these existing questions:
${have}
Return only JSON shaped like {"questions":[ ... ]}, each item like:
${example}`;
  try{
    const res=await AI.json(prompt,{modelTier:"default"});
    const list=(res&&Array.isArray(res.questions))?res.questions:[];
    let n=0;
    for(const g of list){
      if(!g||typeof g.q!=="string"||!Array.isArray(g.o)||g.o.length<2||!Number.isInteger(g.a)||g.a<0||g.a>=g.o.length)continue;
      const id="ai-"+Date.now().toString(36)+"-"+n;
      const w={};for(const [k,v] of Object.entries(g.w||{}))if(typeof v==="string")w[k]=v;
      B.added[id]={id,c:COURSE.id,d,t:String(g.t||DOMAINS[d].short).slice(0,40),type:"mc",ticket:g.ticket?String(g.ticket):"",q:g.q,o:g.o.map(String),a:g.a,w,x:String(g.x||""),h:String(g.h||""),ai:true,made:Date.now()};
      n++;
    }
    if(n){save("bank");toast(`Added ${n} new ${DOMAINS[d].short} questions. They're tagged "Claude-made" in the editor.`)}
    else toast("Claude's answer didn't contain usable questions. Try again.");
  }catch(e){
    if(e&&e.code==="not_granted"){AI=null;toast("Claude wasn't allowed on this page.")}
    else if(e&&e.code==="rate_limited")toast("Claude is busy right now. Try again in a minute.");
    else toast("Couldn't generate questions this time.");
  }
  genBusy=false;if(view==="home"||view==="editor")render();
}

}

const ICONS={core1:`<span class="ico" aria-hidden="true">[▣]</span>`,core2:`<span class="ico" aria-hidden="true">[⚿]</span>`};
function pickHTML(){
  return `<div class="stack pick">
  <pre class="boot anim" aria-hidden="true"><span class="ln">CERT_BENCH . SELECT YOUR EXAM_</span></pre>
  <h1 class="pick-h">What are we studying today?</h1>
  <div class="cards">${COURSE_ORDER.map((k,i)=>{const c=COURSES[k];const qs=c.bank.length;return `<button class="card" data-act="course" data-c="${k}" style="animation-delay:${i*110}ms">
    ${k==="linux"?`<span class="mascot big">${PENGUIN}</span>`:ICONS[k]||""}
    <b>${esc(c.name)}</b><span class="code">${esc(c.code)}</span><span class="meta">${qs}+ questions · ${Object.keys(c.domains).length} domains</span><span class="enter">ENTER &gt;</span></button>`}).join("")}</div>
  <p class="byline">made by <b>damaris ingram</b></p>
  </div>`;
}
function setupHTML(pfx){
  const st=S.settings,types=SprintSetup.filterByTypes(SprintSetup.TYPES.map(type=>({type})),st.qTypes).map(x=>x.type);
  const seg=(act,cur,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button class="btn small" data-act="${act}" data-v="${v}" aria-pressed="${Array.isArray(cur)?cur.includes(v):cur===v}">${l}</button>`).join("")}</div>`;
  const sel=(id,key,vals,fmt)=>`<select id="${pfx+id}" data-set="${key}">${vals.map(v=>`<option value="${v}" ${st[key]===v?"selected":""}>${fmt(v)}</option>`).join("")}</select>`;
  const timed=st.timeMode!=="off",mix=(st.mix||{})[COURSE.id]||{};
  return `<div class="setup">
    <div class="field"><span class="lab">Time limit</span>${seg("time-mode",st.timeMode,[["off","Off"],["perQ","Per question"],["perSprint","Per sprint"]])}</div>
    ${st.timeMode==="perQ"?`<div class="field"><label for="${pfx}PerQ">Seconds per question</label>${sel("PerQ","perQSec",[20,30,45,60,90,120],v=>v+" seconds"+(v===60?" (exam pace)":""))}</div>`:""}
    ${st.timeMode==="perSprint"?`<div class="field"><label for="${pfx}PerS">Minutes per sprint</label>${sel("PerS","perSprintMin",[2,3,5,10,15,20],v=>v+" minutes")}</div>`:""}
    ${timed?`<div class="field"><span class="lab">When time runs out</span>${seg("time-style",st.timeStyle,[["strict","Strict"],["gentle","Gentle"]])}<span class="sub">${st.timeStyle==="strict"?(st.timeMode==="perQ"?"The question locks and counts as a miss.":"The sprint ends; unanswered ones are just not reached."):"The bar turns red and counts over time. Nothing stops you."}</span></div>`:""}
    <div class="field"><span class="lab">Question types</span>${seg("qtype",types,[["mc","MC"],["multi","Multi"],["order","Ordering"],["input","Type-in"]])}</div>
    <div class="field"><label for="${pfx}Mix">Domain mix</label><select id="${pfx}Mix" data-set="mixPreset">${[["exam","Exam weighting"],["even","Even"],["custom","Custom"]].map(([v,l])=>`<option value="${v}" ${st.mixPreset===v?"selected":""}>${l}</option>`).join("")}</select></div>
    ${st.mixPreset==="custom"?`<div class="mixrows">${DOMAIN_IDS.map(d=>`<label for="${pfx}Mix${d}">D${d} · ${esc(DOMAINS[d].short)}</label><select id="${pfx}Mix${d}" data-mix="${d}">${[[0,"Off"],[0.5,"Less"],[1,"Normal"],[2,"More"]].map(([v,l])=>`<option value="${v}" ${(mix[d]==null?1:+mix[d])===v?"selected":""}>${l}</option>`).join("")}</select>`).join("")}</div>`:""}
    ${(n=>`<p class="silk count">≈ ${n} question${n===1?"":"s"} match${n===1?"es":""}</p>`)(SprintSetup.matchCount(allQuestions(),COURSE,st))}
  </div>`;
}
function homeHTML(){
  const t=S.days[today()]||0,goal=S.settings.goal;
  const weak=weakIds().length,st=streak();
  const answered=Object.values(S.stats).reduce((s,x)=>s+x.s,0);
  const hello=answered===0?`${S.settings.roundLen} questions, mixed domains. Anything you miss comes back a few questions later.`:t>=goal?"Daily goal met. Extra rounds still count.":t>0?`${goal-t} more to hit today's goal.`:`${S.settings.roundLen} questions, mixed domains. Anything you miss comes back a few questions later.`;
  const ln=(k,v)=>`<span class="ln"><span class="k">${k}</span> ${v}</span>`;

function weakestDomain(){let best=1,lo=1e9;for(const d of DOMAIN_IDS){const m=mastery(d);const s=m.pct-DOMAINS[d].w/4;if(s<lo){lo=s;best=d}}return best}
let resetArmed=false;

function quizHTML(){
  const c=R.cur,q=c.q,L=R.mode==="lightning";
  const pips=L?"":R.queue.map((x,i)=>{const r=i<R.results.length?R.results[i]:null;return `<i class="${r?(r.ok?"ok":"bad"):i===R.i?"now":""}"></i>`}).join("");
  const top=L?`<div class="qtop"><span class="bigscore tabnum">${R.results.filter(r=>r.ok).length}</span><span class="silk">right</span>${timerHTML()}<span class="combo ${R.combo?"":"zero"}">×${R.combo}</span><button class="btn small ghost" data-act="end">End</button></div>`
   :`<div class="qtop"><span class="qnum tabnum">Q${String(R.i+1).padStart(2,"0")}/${String(R.queue.length).padStart(2,"0")}</span><div class="pips" aria-label="Question ${R.i+1} of ${R.queue.length}">${pips}</div>${R.timer?timerHTML():""}<span class="combo ${R.combo?"":"zero"} ${R.combo>=5?"hot":""} ${c.answered&&c.ok&&R.combo>1?"pop":""}" title="Right answers in a row">×${R.combo}</span><button class="btn small ghost" data-act="end">End round</button></div>`;
  const chips=`<div class="chips"><span class="chip">D${q.d} · ${esc(DOMAINS[q.d]?DOMAINS[q.d].short:"")}</span>${q.t?`<span class="chip">${esc(q.t)}</span>`:""}${c.comeback?`<span class="chip hot">Comeback</span>`:""}${q.ai?`<span class="chip">Claude-made</span>`:""}${q.type==="multi"?`<span class="chip hot">Pick ${q.a.length}</span>`:""}${q.type==="order"?`<span class="chip hot">Tap in order</span>`:""}</div>`;
  const ticket=q.ticket?`<div class="ticket"><span class="silk">Help-desk ticket</span><q>${esc(q.ticket)}</q></div>`:"";
  return `${top}<div class="card">${chips}${ticket}<p class="qtext">${esc(q.q)}</p>${bodyHTML(c)}${L?flashHTML():c.answered?feedbackHTML(c):""}</div>`;
}
function bodyHTML(c){
  const q=c.q;
  if(q.type==="input"){
    return `<form class="typein" data-form="typein"><input id="typein" type="text" inputmode="text" autocomplete="off" placeholder="Type your answer" ${c.answered?"disabled":""} aria-label="Your answer"><button class="btn primary" ${c.answered?"disabled":""}>Check <kbd>Enter</kbd></button></form>`;
  }
  const isRight=i=>q.type==="mc"?i===q.a:q.type==="multi"?q.a.includes(i):false;
  const btns=c.order.map((oi,pos)=>{
    let cls="opt",tag="";
    if(q.type==="order"){
      const at=c.picked.indexOf(oi);
      if(c.answered){cls+=c.picked[oi]===oi&&at===oi?" right":" wrong";tag=`<span class="tag">#${oi+1}</span>`}
      else if(at>=0)cls+=" sel";
      return `<button class="${cls}" data-act="pick" data-i="${oi}" ${c.answered?"disabled":""}><span class="k">${at>=0?at+1:LETTERS[pos]}</span><span>${esc(q.o[oi])}</span>${tag}</button>`;
    }
    const sel=c.picked.includes(oi);
    if(c.answered){if(isRight(oi))cls+=" right";else if(sel)cls+=" wrong";if(sel)tag=`<span class="tag">your pick</span>`;else if(isRight(oi)&&q.type==="multi")tag=`<span class="tag">missed</span>`}
    else if(sel)cls+=" sel";
    return `<button class="${cls}" data-act="pick" data-i="${oi}" ${c.answered?"disabled":""} aria-pressed="${sel}"><span class="k">${LETTERS[pos]}</span><span>${esc(q.o[oi])}</span>${tag}</button>`;
  }).join("");
  let actions="";
  if(!c.answered&&R.mode!=="lightning"){
    const needCheck=q.type==="multi"||q.type==="order";
    actions=`<div class="qactions">${needCheck?`<button class="btn primary" data-act="check" ${q.type==="order"&&c.picked.length<q.o.length?"disabled":""}>Check <kbd>Enter</kbd></button>`:""}${q.type==="order"&&c.picked.length?`<button class="btn small ghost" data-act="clear">Start over</button>`:""}<button class="guess" data-act="guess" aria-pressed="${c.guess}">I'm guessing <kbd>G</kbd></button></div>`;
  }else if(!c.answered&&q.type==="multi"){actions=`<div class="qactions"><button class="btn primary" data-act="check">Check <kbd>Enter</kbd></button></div>`}
  return `<div class="opts">${btns}</div>${actions}`;
}
function correctText(q){
  if(q.type==="mc")return q.o[q.a];
  if(q.type==="multi")return q.a.map(i=>q.o[i]).join(", ");
  if(q.type==="order")return q.o.join(" → ");
  return (q.ans||[])[0];
}
function letterOf(c,oi){const p=c.order.indexOf(oi);return p>=0?LETTERS[p]:""}
function feedbackHTML(c){
  const q=c.q,w=q.w||{};
  let blocks="";
  if(c.ok){
    if(c.guess)blocks+=`<div class="blk"><p><strong>Lucky guess, but it counts.</strong> This one will come back soon to make sure it sticks.</p></div>`;
    if(c.comeback)blocks+=`<div class="blk"><p><strong>You got it this time.</strong> It'll come back later to make sure it stuck.</p></div>`;
    blocks+=`<div class="blk"><span class="silk">Why it's right</span><p>${esc(q.x)}</p></div>`;
  }else{
    if(q.type==="mc"){
      const p=c.picked[0];
      blocks+=`<div class="blk"><span class="silk">Why ${letterOf(c,p)} doesn't fit</span><p>${esc(w[p]||"That option doesn't match what the scenario describes.")}</p></div>`;
      blocks+=`<div class="blk"><span class="silk">The answer: ${letterOf(c,q.a)}. ${esc(q.o[q.a])}</span><p>${esc(q.x)}</p></div>`;
    }else if(q.type==="multi"){
      const wrongPicks=c.picked.filter(i=>!q.a.includes(i)),missed=q.a.filter(i=>!c.picked.includes(i));
      if(wrongPicks.length)blocks+=`<div class="blk"><span class="silk">Shouldn't be picked</span><ul style="margin:0;padding-left:18px">${wrongPicks.map(i=>`<li><strong>${esc(q.o[i])}</strong>: ${esc(w[i]||"")}</li>`).join("")}</ul></div>`;
      if(missed.length)blocks+=`<div class="blk"><span class="silk">You missed</span><ul style="margin:0;padding-left:18px">${missed.map(i=>`<li><strong>${esc(q.o[i])}</strong>: ${esc(w[i]||"This one belongs too.")}</li>`).join("")}</ul></div>`;
      blocks+=`<div class="blk"><span class="silk">The full answer: ${esc(correctText(q))}</span><p>${esc(q.x)}</p></div>`;
    }else if(q.type==="order"){
      const firstBad=c.picked.findIndex((v,i)=>v!==i);
      blocks+=`<div class="blk"><span class="silk">Where it went off</span><p>Step ${firstBad+1} should be <strong>${esc(q.o[firstBad])}</strong>, but you put <strong>${esc(q.o[c.picked[firstBad]])}</strong>.</p></div>`;
      blocks+=`<div class="blk"><span class="silk">Correct order</span><ol style="margin:0;padding-left:22px">${q.o.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;
      blocks+=`<div class="blk"><p>${esc(q.x)}</p></div>`;
    }else{
      blocks+=`<div class="blk"><span class="silk">You typed "${esc(c.input||"(nothing)")}". The answer is ${esc((q.ans||[])[0])}.</span><p>${esc(q.x)}</p></div>`;
    }
  }
  if(q.h)blocks+=`<div class="hook"><span class="silk">Hook</span><p>${esc(q.h)}</p></div>`;
  if((q.type==="mc")&&Object.keys(w).length){
    const others=q.o.map((o,i)=>i).filter(i=>i!==q.a&&!(c.picked[0]===i&&!c.ok)&&w[i]);
    if(others.length)blocks+=`<details class="others"><summary>Why the other options are wrong</summary><ul>${others.map(i=>`<li><strong>${letterOf(c,i)}. ${esc(q.o[i])}</strong>: ${esc(w[i])}</li>`).join("")}</ul></details>`;
  }
  blocks+=aiHTML(c);
  const last=R.i+1>=R.queue.length;
  const note=!c.ok?(c.comeback?"Still shaky. It's saved to Weak spots.":"This one comes back in a few questions."):R.combo>=3?`${R.combo} in a row.`:"";
  return `<div class="fb ${c.ok?"ok":"bad"}"><div class="head"><h3>${c.ok?"Correct":"Not quite"}</h3>${c.timedOut?`<span class="chip hot">TIME'S UP</span>`:""}${c.gain?`<span class="xp">+${c.gain} XP</span>`:""}</div><div class="body">${blocks}</div>
   <div class="nextbar"><span class="note">${esc(note)}</span>${!c.ok?`<button class="btn small ghost" data-act="edit-this">Edit this question</button>`:""}<button class="btn primary" id="nextBtn" data-act="next">${last?"See results":"Next"} <kbd>Enter</kbd></button></div></div>`;
}
function flashHTML(){
  const f=R.flash;if(!f)return "";
  return f.ok?`<div class="flash ok">Right. +${f.c.gain}</div>`:`<div class="flash bad">It's ${esc(correctText(f.q))}. ${esc(f.q.h||"")}</div>`;
}

function gradeOf(r,n){const p=n?r/n:0;return p===1?"S":p>=.85?"A":p>=.7?"B":p>=.5?"C":"D"}
function summaryHTML(){
  const res=R.results,L=R.mode==="lightning";
  const firsts=res.filter(r=>!r.comeback),right=firsts.filter(r=>r.ok).length;
  const fixed=res.filter(r=>r.comeback&&r.ok).length;
  const missed=[...new Map(res.filter(r=>!r.ok).map(r=>[r.id,r])).values()];
  const stillMissed=missed.filter(m=>!res.some(r=>r.id===m.id&&r.comeback&&r.ok));
  const head=L?`<div class="score"><span class="n tabnum">${res.filter(r=>r.ok).length}</span><span class="of">right in 60 seconds</span></div>${R.newBest?`<p class="silk" style="color:var(--led-ink)">New personal best</p>`:`<p class="silk">Best: ${bestL()}</p>`}`
    :`<div class="done-head"><span class="grade" aria-label="Grade">${gradeOf(right,firsts.length)}</span><span class="silk">Round complete</span><div class="score"><span class="n tabnum">${right}</span><span class="of">/ ${firsts.length} first try</span></div></div>`;
  const msg=L?"":SprintSetup.summaryMsg({right,total:firsts.length,missed:missed.length,fixed,unreached:R.unreached||0});
  /* timed rounds (not Lightning): time tiles plus time-outs, overtime and not-reached lines */
  const T=!L&&R.timer,strict=T&&T.style==="strict",usedMs=res.reduce((a,r)=>a+(r.ms||0),0);
  const timeTiles=T?`<div class="tile"><b class="tabnum">${SprintSetup.fmtClock(T.mode==="perSprint"?T.usedMs:usedMs)}</b><span>Time used</span></div>
       <div class="tile"><b class="tabnum">${res.length?Math.round(usedMs/res.length/1000):0}s</b><span>Avg / question</span></div>`:"";
  const timedOut=res.filter(r=>r.timedOut).length,ranOver=res.map((r,i)=>[r,i]).filter(([r])=>r.overMs>0);
  const timeLines=T?[
    strict&&T.mode==="perQ"&&timedOut?`${timedOut} timed out`:"",
    strict&&T.mode==="perSprint"&&R.unreached>0?`${R.unreached} not reached`:"",
    !strict&&T.mode==="perSprint"&&SprintSetup.timerLeft(T)<0?`Finished ${SprintSetup.fmtClock(SprintSetup.timerLeft(T))} over`:"",
    !strict&&ranOver.length?"Ran over: "+ranOver.map(([r,i])=>`Q${i+1} ${SprintSetup.fmtClock(-r.overMs)}`).join(", "):""
  ].filter(Boolean):[];
  return `<div class="stack">
   <section class="panel stack">
     ${head}${msg?`<p style="margin:0;font-weight:600">${esc(msg)}</p>`:""}
     <div class="tiles">
       <div class="tile"><b class="tabnum">+${R.xp}</b><span>XP earned</span></div>
       <div class="tile"><b class="tabnum">×${R.maxCombo}</b><span>Best streak</span></div>
       <div class="tile"><b class="tabnum">${fixed}</b><span>Fixed on comeback</span></div>
       <div class="tile"><b class="tabnum">${S.days[today()]||0}/${S.settings.goal}</b><span>Today's goal</span></div>
       ${timeTiles}
     </div>
     ${timeLines.map(l=>`<p class="silk time-line" style="margin:0">${esc(l)}</p>`).join("")}
     <div class="row">
       <button class="btn primary go" data-act="${L?"lightning":"again"}">${L?"Go again":"Another sprint"} <kbd>Enter</kbd></button>
       ${stillMissed.length?`<button class="btn" data-act="drill-missed">${stillMissed.length===1?"Drill that one again":"Drill these "+stillMissed.length+" again"}</button>`:""}
       <button class="btn ghost" data-act="home">Home</button>
     </div>
   </section>
   ${missed.length?`<section class="panel"><div class="sectionhead"><h2>Review</h2><span class="silk">${stillMissed.length?"Still shaky: "+stillMissed.length:"All fixed"}</span></div>
     ${missed.map(m=>`<div class="miss"><span class="silk">D${m.q.d} · ${esc(m.q.t||"")}${m.timedOut?` <span class="chip hot">TIME'S UP</span>`:""}</span><div>${esc(m.q.q)}</div><div class="a">${esc(correctText(m.q))}</div><div>${esc(m.q.x||"")}</div>${m.q.h?`<div class="h">${esc(m.q.h)}</div>`:""}</div>`).join("")}
   </section>`:""}
  </div>`;
}

function editorInit(selId){

}
function newQ(){
  E.sel="u-"+Date.now().toString(36);E.isNew=true;E.delArmed=false;
  E.draft={id:E.sel,c:COURSE.id,d:E.filter.d||1,t:"",type:"mc",ticket:"",q:"",o:["","","",""],a:0,w:{},x:"",h:"",mine:true};
}
function edList(){
  const f=E.filter,txt=f.text.toLowerCase();
  const rows=[...BANK.map(q=>B.overrides[q.id]?Object.assign({},B.overrides[q.id],{id:q.id}):q),...Object.values(B.added).filter(addedIn)];
  return rows.filter(q=>{
    const hidden=B.hidden.includes(q.id),edited=!!B.overrides[q.id],mine=!!B.added[q.id];
    if(f.d&&q.d!==f.d)return false;
    if(f.show==="hidden"&&!hidden)return false;
    if(f.show!=="hidden"&&f.show!=="all"&&hidden)return false;
    if(f.show==="edited"&&!edited)return false;
    if(f.show==="mine"&&!mine)return false;
    if(f.show==="missed"){const st=S.stats[q.id];if(!st||!st.w)return false}
    if(txt&&!(q.q+" "+(q.t||"")+" "+(q.o||[]).join(" ")+" "+(q.ticket||"")).toLowerCase().includes(txt))return false;
    return true;
  });
}

function readDraftValidation(){
  const q=E.draft;
  if(!q.q.trim())return "Add the question text.";
  if(q.type==="mc"||q.type==="multi"){
    q.o=q.o.map(s=>s.trim());
    if(q.o.some(s=>!s))return "Every option needs text, or remove the empty ones.";
    if(q.type==="multi"&&(!Array.isArray(q.a)||!q.a.length))return "Mark at least one right answer.";
    if(q.type==="mc"&&!(Number.isInteger(q.a)&&q.a<q.o.length))return "Mark the right answer.";
  }
  if(q.type==="order"&&(q.o||[]).length<2)return "Add at least two steps.";
  if(q.type==="input"&&!(q.ans||[]).length)return "Add at least one accepted answer.";
  return "";
}
function saveDraft(){
  const err=readDraftValidation();if(err){toast(err);return false}
  const q=clone(E.draft);
  if(q.type!=="mc"&&q.type!=="multi")q.w={};
  if(builtIn(q.id))B.overrides[q.id]=q;else{q.mine=!q.ai;B.added[q.id]=q}
  E.isNew=false;save("bank");toast("Saved. It'll show up in your next round.");return true;
}
function onEdInput(t){
  const q=E.draft;if(!q)return;
  if(t.dataset.f){
    const f=t.dataset.f,v=t.value;
    if(f==="d")q.d=+v;
    else if(f==="type"){
      q.type=v;
      if(v==="mc"){if(!q.o||q.o.length<2)q.o=["","","",""];q.a=Array.isArray(q.a)?(q.a[0]||0):(q.a||0)}
      if(v==="multi"){if(!q.o||q.o.length<2)q.o=["","","",""];q.a=Array.isArray(q.a)?q.a:[q.a||0]}
      if(v==="order"){q.a=undefined}
      if(v==="input"){q.ans=q.ans||[]}
      render();return;
    }
    else if(f==="orderText")q.o=v.split("\n").map(s=>s.trim()).filter(Boolean);
    else if(f==="ansText")q.ans=v.split(",").map(s=>s.trim()).filter(Boolean);
    else q[f]=v;
  }else if(t.dataset.o!=null)q.o[+t.dataset.o]=t.value;
  else if(t.dataset.w!=null){q.w=q.w||{};const i=t.dataset.w;if(t.value.trim())q.w[i]=t.value;else delete q.w[i]}
  else if(t.dataset.a!=null){
    const i=+t.dataset.a;
    if(q.type==="multi"){q.a=Array.isArray(q.a)?q.a:[];if(t.checked){if(!q.a.includes(i))q.a.push(i)}else q.a=q.a.filter(x=>x!==i);q.a.sort()}
    else q.a=i;
  }
}

function labsLine(){const ls=labsFor(COURSE.id),done=ls.filter(l=>(S.labs||{})[l.id]).length;return done?`${done} of ${ls.length} done`:`${ls.length} hands-on labs`}

function openLab(id){

  LAB={lab,part:0,order:lab.parts.map(p=>p.kind==="buckets"?shuffle(p.items.map((_,i)=>i)):[]),

/* re-render, then put keyboard focus back where the user was */
function labRender(focusSel){render();if(focusSel){const el=$(focusSel);if(el)el.focus({preventScroll:true})}}
const labLocked=()=>!LAB||!!LAB.checked[LAB.part];
function labSet(key,value){
  if(labLocked())return;const i=LAB.part;
  LAB.answers[i]=value===undefined?Labs.unplace(LAB.answers[i],key):Labs.place(LAB.answers[i],key,value);
}
function labChange(t){
  const v=t.dataset.t==="check"?t.checked:t.value===""?undefined:+t.value;
  labSet(t.dataset.t==="slot"?+t.dataset.lab:t.dataset.lab,v);labRender("#"+t.id);
}
function labItem(k){
  if(labLocked())return;const ans=LAB.answers[LAB.part];
  if(ans[k]!=null){labSet(k,undefined);LAB.sel=null}
  else LAB.sel=LAB.sel&&LAB.sel.kind==="item"&&LAB.sel.key===k?null:{kind:"item",key:k};
  SFX.play("tick");labRender('[data-act=lab-item][data-k="'+k+'"]');
}
function labBucket(b){
  if(labLocked()||!LAB.sel||LAB.sel.kind!=="item")return;
  labSet(LAB.sel.key,b);LAB.sel=null;SFX.play("tick");labRender('.bucket-h[data-b="'+b+'"]');
}
function labDrop(k,zone){
  if(labLocked()||isNaN(k))return;
  labSet(k,zone==="tray"?undefined:+zone);LAB.sel=null;SFX.play("tick");render();
}
function labLabel(l){
  if(labLocked())return;
  LAB.sel=LAB.sel&&LAB.sel.kind==="label"&&LAB.sel.key===l?null:{kind:"label",key:l};
  labRender('[data-act=lab-label][data-l="'+l+'"]');
}
function labSlot(k){
  if(labLocked())return;
  if(LAB.sel&&LAB.sel.kind==="label"){labSet(k,LAB.sel.key);LAB.sel=null;SFX.play("tick")}
  else if(LAB.answers[LAB.part][k]!=null)labSet(k,undefined);
  labRender('[data-act=lab-slot][data-k="'+k+'"]');
}
function labCheck(){
  const i=LAB.part,p=LAB.lab.parts[i];
  if(LAB.checked[i]||!Labs.ready(p,LAB.answers[i]))return;
  const r=Labs.gradePart(p,LAB.answers[i]);
  LAB.checked[i]=r;if(!LAB.first[i])LAB.first[i]=r;LAB.sel=null;
  SFX.play(r.points===r.max?"ok":"bad");labRender(".lab-score");
}
function labRetry(){
  const i=LAB.part;LAB.answers[i]=Labs.emptyAnswer(LAB.lab.parts[i]);LAB.checked[i]=null;LAB.sel=null;
  labRender(".lab-task");
}

function bucketsHTML(p,i,ans,res){
  const locked=!!res,sel=LAB.sel;
  const chip=k=>{const m=res&&res.marks[k];return `<button class="lchip${markCls(m)}" data-act="lab-item" data-k="${k}" draggable="${!locked}" aria-pressed="${!!(sel&&sel.kind==="item"&&sel.key===k)}" ${locked?"disabled":""}>${esc(p.items[k].t)}</button>`};
  const tray=LAB.order[i].filter(k=>ans[k]==null);
  return `${locked?"":`<div class="tray" data-drop="tray" aria-label="Items to place">${tray.length?tray.map(chip).join(""):`<span class="silk">All placed</span>`}</div>`}
  <div class="buckets">${p.buckets.map((b,bi)=>`<div class="bucket${sel&&sel.kind==="item"?" armed":""}" data-drop="${bi}" data-act="lab-bucket" data-b="${bi}">
    <button class="bucket-h" data-act="lab-bucket" data-b="${bi}" ${locked?"disabled":""}>${esc(b)}</button>
    <div class="bucket-items">${LAB.order[i].filter(k=>ans[k]===bi).map(chip).join("")}</div></div>`).join("")}</div>`;
}
function configHTML(p,ans,res){
  const locked=!!res,dis=locked?"disabled":"";
  const ctl=(f,key,withAria)=>{
    const id="lf"+key.replace(".","_"),v=ans[key],cls=markCls(res&&res.marks.find(m=>m.key===key)),aria=withAria?` aria-label="${esc(f.label)}"`:"";
    if(f.type==="select")return `<select id="${id}" class="lctl${cls}" data-lab="${key}" data-t="select" ${dis}${aria}><option value="">Choose…</option>${f.o.map((o,oi)=>`<option value="${oi}" ${v===oi?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    if(f.type==="text")return `<input id="${id}" class="lctl${cls}" data-lab="${key}" data-t="text" type="text" value="${esc(v||"")}" placeholder="${esc(f.ph||"")}" autocomplete="off" autocapitalize="off" spellcheck="false" ${dis}${aria}>`;
    return `<input id="${id}" class="lctl${cls}" data-lab="${key}" data-t="check" type="checkbox" ${(v===undefined?f.init:v)?"checked":""} ${dis}${aria}>`;
  };
  const out=[];let table=[];
  const flush=()=>{if(!table.length)return;const h=p.head||[],rowHead=h.length===table[0].row.length+1;
    out.push(`<div class="ltable-wrap"><table class="ltable">${h.length?`<thead><tr>${h.map(x=>`<th scope="col">${esc(x)}</th>`).join("")}</tr></thead>`:""}<tbody>${table.map(({row,r})=>`<tr>${rowHead?`<th scope="row">${esc(row[0].label.split(":")[0])}</th>`:""}${row.map((f,c)=>`<td>${ctl(f,r+"."+c,true)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);table=[]};
  p.rows.forEach((row,r)=>{
    if(row.length>1){table.push({row,r});return}
    flush();const f=row[0],key=r+".0";
    out.push(f.type==="check"?`<label class="lcheck">${ctl(f,key)}<span>${esc(f.label)}</span></label>`
      :`<div class="field lfield"><label for="lf${r}_0">${esc(f.label)}</label>${ctl(f,key)}</div>`);
  });
  flush();
  return `<div class="lconfig">${out.join("")}</div>`;
}

}
function finishLab(){
  if(!LAB||LAB.done||!LAB.first.every(Boolean))return;
  const id=LAB.lab.id,score=Labs.labScore(LAB.first),labs=S.labs=S.labs||{},prev=labs[id];
  const lvBefore=level(),goalBefore=(S.days[today()]||0)<S.settings.goal;
  labs[id]={best:Math.max(prev?prev.best:0,score.pct),tries:(prev?prev.tries:0)+1,last:Date.now()};
  S.xp+=5*score.points;S.days[today()]=(S.days[today()]||0)+score.max;
  save("state");updateBar();
  LAB.done={score,newBest:!prev||score.pct>prev.best};
  render();window.scrollTo({top:0});SFX.play("done");
  if(level()>lvBefore){banner("LEVEL "+level(),"level up","level");confetti(120)}
  if(goalBefore&&(S.days[today()]||0)>=S.settings.goal){banner("GOAL MET",S.settings.goal+" questions today","goal");confetti(80)}
  else if(score.pct>=70)confetti(score.pct===100?160:90);
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act;
  if(act!=="reset-progress"&&resetArmed){resetArmed=false}
  switch(act){
    case "theme":{const i=THEMES.findIndex(t=>t[0]===S.settings.phosphor);S.settings.phosphor=THEMES[(i+1)%THEMES.length][0];save("state");applyLook();render();toast("Theme: "+THEMES[(i+1)%THEMES.length][1]);break}
    case "snd":S.settings.sound=!S.settings.sound;save("state");updateBar();SFX.play("ok");if(view==="home")render();break;
    case "home":clearTimeout(lightT);view=view==="home"?"pick":"home";R=null;LAB=null;render();break;
    case "courses":LAB=null;view="pick";render();break;
    case "sprint":startRound("sprint");break;
    case "again":startRound(R&&R.mode==="weak"?"weak":"sprint",{domain:R?R.domain:0,topic:R?R.topic:""});break;
    case "domain":startRound("sprint",{domain:+el.dataset.d});break;
    case "topic":startRound("sprint",{topic:el.dataset.t});break;
    case "course":switchCourse(el.dataset.c);break;
    case "weak":startRound("weak");break;
    case "lightning":startRound("lightning");break;
    case "labs":openLabs();break;
    case "home-course":LAB=null;view="home";render();break;
    case "lab-open":openLab(el.dataset.id);break;
    case "lab-back":openLabs();break;
    case "lab-part":LAB.part=+el.dataset.i;LAB.sel=null;labRender('[data-act=lab-part][data-i="'+LAB.part+'"]');break;
    case "lab-next":LAB.part=Math.min(LAB.part+1,LAB.lab.parts.length-1);LAB.sel=null;labRender('[data-act=lab-part][data-i="'+LAB.part+'"]');break;
    case "lab-item":labItem(+el.dataset.k);break;
    case "lab-bucket":labBucket(+el.dataset.b);break;
    case "lab-label":labLabel(+el.dataset.l);break;
    case "lab-slot":labSlot(+el.dataset.k);break;
    case "lab-check":labCheck();break;
    case "lab-retry":labRetry();break;
    case "lab-finish":finishLab();break;
    case "lab-retry-all":openLab(LAB.lab.id);break;
    case "time-mode":S.settings.timeMode=el.dataset.v;save("state");render();break;
    case "time-style":S.settings.timeStyle=el.dataset.v;save("state");render();break;
    case "qtype":{const cur=SprintSetup.filterByTypes(SprintSetup.TYPES.map(type=>({type})),S.settings.qTypes).map(x=>x.type),v=el.dataset.v;
      if(cur.includes(v)&&cur.length===1){toast("Keep at least one question type on");break}
      S.settings.qTypes=cur.includes(v)?cur.filter(x=>x!==v):SprintSetup.TYPES.filter(x=>x===v||cur.includes(x));save("state");render();break}
    case "drill-missed":{const ids=[...new Set(R.results.filter(r=>!r.ok).map(r=>r.id))];startRound("list",{list:ids});break}
    case "end":if(R&&R.results.length)finish();else{clearTimeout(lightT);view="home";R=null;render()}break;
    case "pick":onPick(+el.dataset.i);break;
    case "check":if(R&&R.cur&&!R.cur.answered&&(R.cur.picked.length||R.cur.q.type==="input"))grade();break;
    case "clear":R.cur.picked=[];render();break;
    case "guess":R.cur.guess=!R.cur.guess;el.setAttribute("aria-pressed",R.cur.guess);break;
    case "next":next();break;
    case "ai-explain":askClaude();break;
    case "ai-stop":if(R&&R.cur&&R.cur.ai&&R.cur.ai.ac)R.cur.ai.ac.abort();break;
    case "edit-this":{const id=R.cur.q.id;if(id.startsWith("g:")){toast("Rapid-fire questions come from the fact tables and can't be edited here.");break}view="editor";editorInit(id);render();break}
    case "editor":view="editor";editorInit();render();break;
    case "gen-weakest":generateQuestions(weakestDomain());break;
    case "gen-domain":generateQuestions(E.filter.d||weakestDomain());break;
    case "reset-progress":
      if(!resetArmed){resetArmed=true;render();break}
      resetArmed=false;const keep=S.settings;S=defState();S.settings=keep;save("state");render();toast("Progress erased. Your question edits are kept.");break;
    case "ed-sel":selectQ(el.dataset.id);render();break;
    case "ed-new":newQ();render();setTimeout(()=>{const f=$("#fQ");if(f)f.focus()},0);break;
    case "ed-addopt":E.draft.o.push("");render();break;
    case "ed-delopt":{const i=+el.dataset.i,q=E.draft;q.o.splice(i,1);const w={};Object.entries(q.w||{}).forEach(([k,v])=>{k=+k;if(k<i)w[k]=v;else if(k>i)w[k-1]=v});q.w=w;
      if(q.type==="multi")q.a=(q.a||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);else if(q.a===i)q.a=0;else if(q.a>i)q.a--;render();break}
    case "ed-try":{const orig=resolve(E.draft.id);const same=orig&&JSON.stringify(orig)===JSON.stringify(E.draft);if(same||saveDraft())startRound("list",{list:[E.draft.id]});break}
    case "ed-revert":delete B.overrides[E.draft.id];save("bank");selectQ(E.draft.id);render();toast("Restored the original.");break;
    case "ed-hide":{const id=E.draft.id;if(B.hidden.includes(id))B.hidden=B.hidden.filter(x=>x!==id);else B.hidden.push(id);save("bank");render();break}
    case "ed-del":if(!E.delArmed){E.delArmed=true;render();break}delete B.added[E.draft.id];B.hidden=B.hidden.filter(x=>x!==E.draft.id);save("bank");E.sel=null;E.draft=null;render();toast("Deleted.");break;
    case "io":E.ioOpen=!E.ioOpen;render();break;
    case "io-copy":{const txt=JSON.stringify({core1bench:1,overrides:B.overrides,added:B.added,hidden:B.hidden},null,1);E.io=txt;const ta=$("#ioText");if(ta)ta.value=txt;
      try{navigator.clipboard.writeText(txt).then(()=>toast("Backup copied."),()=>{if(ta){ta.focus();ta.select()}toast("Couldn't copy automatically. The backup is selected; copy it yourself.")})}catch(err){if(ta){ta.focus();ta.select()}}break}
    case "io-import":{let d;try{d=JSON.parse(($("#ioText")||{}).value||"")}catch(err){toast("That doesn't look like a backup. Paste the full text you copied.");break}
      if(!d||typeof d!=="object"||!(d.overrides||d.added||d.hidden)){toast("That doesn't look like a Bench backup.");break}
      Object.assign(B.overrides,d.overrides||{});Object.assign(B.added,d.added||{});B.hidden=[...new Set([...B.hidden,...(d.hidden||[])])];save("bank");E.io="";render();toast("Restored. Existing questions with the same id were replaced.");break}
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==="typein"){const i=$("#typein");if(R&&R.cur&&!R.cur.answered){R.cur.input=i.value;if(i.value.trim())grade()}}
  else if(f==="ai-follow"){const i=$("#aiFollow");askClaude(i.value)}
  else if(f==="ed"){saveDraft();render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="typein"&&R&&R.cur)R.cur.input=t.value;
  else if(t.dataset.lab!=null&&t.dataset.t==="text")labSet(t.dataset.lab,t.value.trim()?t.value:undefined);
  else if(t.dataset.filter==="text"){E.filter.text=t.value;const l=$("#edList");const pos=t.selectionStart;render();const s=$("#edSearch");if(s){s.focus();s.setSelectionRange(pos,pos)}}
  else if(t.dataset.io)E.io=t.value;
  else if(view==="editor"&&t.closest("[data-form=ed]")&&t.type!=="radio"&&t.type!=="checkbox"&&t.tagName!=="SELECT")onEdInput(t);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.lab!=null&&t.dataset.t!=="text"){labChange(t);return}
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=["autoNext","sound","crt"].includes(k)?t.value==="1":["phosphor","mixPreset"].includes(k)?t.value:+t.value;save("state");applyLook();render();if(k==="sound"&&S.settings.sound)SFX.play("ok")}
  else if(t.dataset.mix){const m=S.settings.mix=S.settings.mix||{};(m[COURSE.id]=m[COURSE.id]||{})[t.dataset.mix]=+t.value;save("state");render()}
  else if(t.dataset.filter&&t.dataset.filter!=="text"){E.filter[t.dataset.filter]=t.dataset.filter==="d"?+t.value:t.value;render()}
  else if(view==="editor"&&t.closest("[data-form=ed]")&&(t.type==="radio"||t.type==="checkbox"||t.tagName==="SELECT"))onEdInput(t);
});
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".lchip[data-act=lab-item]");if(!c||view!=="lab")return;e.dataTransfer.setData("text/plain",c.dataset.k);e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragover",e=>{if(view==="lab"&&e.target.closest&&e.target.closest("[data-drop]"))e.preventDefault()});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");if(!z||view!=="lab")return;e.preventDefault();labDrop(parseInt(e.dataTransfer.getData("text/plain"),10),z.dataset.drop)});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.drawer)UI.open[d.dataset.drawer]=d.open},true);
function onPick(i){
  const c=R&&R.cur;if(!c||c.answered)return;const q=c.q;
  if(q.type==="mc"){c.picked=[i];grade();return}
  if(q.type==="multi"){c.picked=c.picked.includes(i)?c.picked.filter(x=>x!==i):[...c.picked,i];SFX.play("tick");render();return}
  if(q.type==="order"){c.picked=c.picked.includes(i)?c.picked.filter(x=>x!==i):[...c.picked,i];SFX.play("tick");render();return}
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase(),typing=tag==="input"||tag==="textarea"||tag==="select";
  if(view==="lab"&&e.key==="Escape"){e.preventDefault();openLabs();return}
  if(typing)return;
  const onButton=tag==="button";
  if(view==="lab"&&LAB&&LAB.done&&e.key==="Enter"&&!onButton){e.preventDefault();openLab(LAB.lab.id);return}
  if(e.key.toLowerCase()==="m"){S.settings.sound=!S.settings.sound;save("state");updateBar();if(S.settings.sound)SFX.play("ok");return}
  if(view==="home"&&e.key.toLowerCase()==="w"){startRound("weak");return}
  if(view==="home"&&e.key.toLowerCase()==="l"){startRound("lightning");return}
  if(view==="home"&&e.key.toLowerCase()==="b"){openLabs();return}
  if(view==="quiz"&&e.key==="Escape"&&R){if(R.results.length)finish();else{clearTimeout(lightT);view="home";R=null;render()}return}
  if(view==="home"&&e.key==="Enter"&&!onButton){e.preventDefault();startRound("sprint");return}
  if(view==="summary"&&e.key==="Enter"&&!onButton){e.preventDefault();if(R.mode==="lightning")startRound("lightning");else startRound(R.mode==="weak"?"weak":"sprint",{domain:R.domain,topic:R.topic});return}
  if(view!=="quiz"||!R||!R.cur)return;
  const c=R.cur;
  if(!c.answered){
    const k=e.key.toLowerCase();let idx=-1;
    if(/^[1-8]$/.test(k))idx=+k-1;else if(/^[a-h]$/.test(k)&&k!=="g"&&k!=="e")idx=LETTERS.toLowerCase().indexOf(k);
    if(idx>=0&&c.order&&idx<c.order.length){e.preventDefault();onPick(c.order[idx]);return}
    if(k==="g"&&R.mode!=="lightning"){c.guess=!c.guess;const g=$(".guess");if(g)g.setAttribute("aria-pressed",c.guess);return}
    if(e.key==="Enter"&&!onButton&&(c.q.type==="multi"||c.q.type==="order")&&c.picked.length){e.preventDefault();grade()}
  }else if(R.mode!=="lightning"){
    if((e.key==="Enter"||e.key==="ArrowRight")&&!onButton){e.preventDefault();next()}
    else if(e.key.toLowerCase()==="e"&&AI&&!(c.ai&&c.ai.busy)){e.preventDefault();askClaude()}
  }
});

/* ───────── boot ───────── */
applyLook();document.body.classList.add("boot");setTimeout(()=>document.body.classList.remove("boot"),700);
render();
connect();
connectAI();
})();
</script>
</body>
</html>
